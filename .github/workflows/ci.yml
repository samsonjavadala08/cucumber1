name: CI Pipeline - Cucumber Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Run Cucumber Tests
        run: mvn test

      - name: Upload Extent Report
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: target/ExtentReport/cucumber-reports.html

  email-report:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Download Extent Report
        uses: actions/download-artifact@v4
        with:
          name: cucumber-reports
          path: ./report

      - name: Send Email with Report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "Cucumber Test Report - ${{ github.run_number }}"
          to: "qa-team@example.com"
          from: "ci-pipeline@example.com"
          body: |
            Hello Team,

            The latest Cucumber test run has completed.
            Please find the attached report.

            Regards,
            CI/CD Pipeline
          attachments: "./report/cucumber-reports.html"
